apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  # cloudflared reads ingress rules from this file, not from a Kubernetes
  # Ingress object. No grafana.smithlabs.io rule (cp-08-edge.md: Grafana
  # stays on the tailnet, never public) and no hooks.smithlabs.io rule
  # (CP-12's receiver doesn't exist yet). Catch-all last is required by
  # Cloudflare Tunnel.
  config.yml: |
    ingress:
      - hostname: api.smithlabs.io
        service: http://traefik.traefik.svc.cluster.local:80
      - service: http_status:404
