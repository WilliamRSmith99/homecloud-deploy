apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      affinity:
        podAntiAffinity:
          # Required, not preferred: two nodes, two replicas — the whole
          # point is one replica per node (R-09). "Preferred" would let the
          # scheduler double up under pressure and silently drop the
          # redundancy this exists for.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cloudflared
              topologyKey: kubernetes.io/hostname
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            # Cloudflare terminates TLS at the edge; this tunnel needs no
            # cert-manager Certificate or Secret of its own.
            #
            # No --config/ingress ConfigMap: a token-authenticated tunnel is
            # remotely managed — cloudflared fetches its ingress rules from
            # Cloudflare and silently ignores a local config file's ingress
            # section (confirmed: cloudflare/cloudflared#1029). The real
            # ingress rules live in exosphere-terraform's
            # cloudflare_zero_trust_tunnel_cloudflared_config resource.
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
