apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - servicemonitor.yaml
  # Not created yet — see docs/deploying_a_new_sealed_secret.md. Must exist
  # (namespace: monitoring, keys ACCESS_KEY_ID/SECRET_ACCESS_KEY) before this
  # kustomization will build or Loki will start writing chunks successfully.
  - loki-s3-creds-sealedsecret.yaml
helmCharts:
  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: 7.3.0
    releaseName: loki
    namespace: monitoring
    valuesFile: values.yaml
