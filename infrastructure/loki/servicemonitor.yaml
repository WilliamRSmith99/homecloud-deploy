# Hand-written rather than via the chart's monitoring.serviceMonitor toggle:
# that template is gated behind a Helm Capabilities.APIVersions check that
# never passes through this repo's ArgoCD pipeline (argocd-cm's
# kustomize.buildOptions is just "--enable-helm", no --helm-api-versions), so
# the toggle silently renders nothing. A plain resource has no such gate.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loki
  namespace: monitoring
  labels:
    # Matches kube-prometheus-stack's serviceMonitorSelector so Prometheus
    # picks this up with no extra wiring.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: single-binary
      app.kubernetes.io/instance: loki
      app.kubernetes.io/name: loki
  endpoints:
    - port: http-metrics
      path: /metrics
