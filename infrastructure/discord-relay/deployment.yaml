# HC-10 — translates Alertmanager's webhook_config POSTs into Discord's
# message shape. rogerrum/alertmanager-discord rather than the original
# benjojo/alertmanager-discord: benjojo's image is amd64-only (last built
# 2022), which never runs on this cluster's arm64 nodes. Same interface
# (DISCORD_WEBHOOK env, port 9094, root-path webhook) either way.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-discord
  namespace: monitoring
  labels:
    app: alertmanager-discord
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager-discord
  template:
    metadata:
      labels:
        app: alertmanager-discord
    spec:
      containers:
        - name: alertmanager-discord
          image: rogerrum/alertmanager-discord:1.0.7
          ports:
            - name: http
              containerPort: 9094
          env:
            # Defaults to 127.0.0.1:9094 — loopback-only inside the
            # container, so the Service could never reach it. Must be set
            # explicitly or every alert silently fails to deliver.
            - name: LISTEN_ADDRESS
              value: "0.0.0.0:9094"
          envFrom:
            - secretRef:
                name: discord-webhook
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
