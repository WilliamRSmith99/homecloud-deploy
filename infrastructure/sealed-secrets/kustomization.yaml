apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
# Kustomize's helmCharts generator runs `helm template`, which skips the chart's
# crds/ directory. The bitnami/sealed-secrets chart ships the SealedSecret CRD
# there, so it was never installed and the controller crash-looped its watch.
# Vendor the CRD from chart 2.19.3 (controller appVersion 0.39.1) and apply it here.
resources:
  - crd.yaml
helmCharts:
  - name: sealed-secrets
    repo:  https://bitnami.github.io/sealed-secrets
    version: 2.19.3
    releaseName: sealed-secrets
    namespace: kube-system
    valuesFile: values.yaml
