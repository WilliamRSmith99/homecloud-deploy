crds:
  enabled: true
  keep: true

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 20GB
    resources:
      requests:
        memory: 2Gi
        cpu: 200m
      limits:
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 25Gi

# HC-10 — route alerts to the Discord relay (infrastructure/discord-relay/).
# Helm deep-merges this into the chart's own default alertmanager.config
# (values.yaml on prometheus-community/helm-charts) rather than replacing
# it, so what's NOT respecified here still applies: inhibit_rules, and the
# route.routes sub-rule that silently swallows the synthetic Watchdog
# alert via the 'null' receiver — which is why that receiver stays defined
# below even though nothing here targets it directly.
alertmanager:
  config:
    route:
      receiver: discord
    receivers:
      - name: 'null'
      - name: discord
        webhook_configs:
          - url: http://alertmanager-discord.monitoring.svc.cluster.local:9094
            send_resolved: true
