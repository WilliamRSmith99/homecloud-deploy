apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Not created yet — see docs/deploying_a_new_sealed_secret.md. Must exist
  # (namespace: monitoring, keys admin-user/admin-password) before this
  # kustomization will build or Grafana will fall back to the chart's
  # plaintext default admin password.
  - admin-credentials-sealedsecret.yaml
helmCharts:
  - name: grafana
    repo: https://grafana-community.github.io/helm-charts
    version: 13.2.4
    releaseName: grafana
    namespace: monitoring
    valuesFile: values.yaml
