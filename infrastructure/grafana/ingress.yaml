apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    tailscale.com/hostname: grafana   # pins the MagicDNS name — this is the "static" part
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - grafana            # operator expands to argocd.<tailnet>.ts.net for the cert
  rules:
    - host: grafana
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-server
                port:
                  number: 443