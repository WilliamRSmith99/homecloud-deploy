apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: overlap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: git@github.com:WilliamRSmith99/homecloud-deploy
    targetRevision: main
    path: apps/overlap
  destination:
    server: https://kubernetes.default.svc
    namespace: overlap
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
