apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: overlap
  namespace: argocd
  annotations:
    # sync-waves.md documents apps at wave 2 (needs Postgres + networking).
    # This was 0 while Overlap used a local PVC and needed neither — now that
    # it depends on postgres-cluster (wave 1), it has to sync after it.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: git@github.com:WilliamRSmith99/homecloud-deploy
    targetRevision: main
    path: apps/overlap
  destination:
    server: https://kubernetes.default.svc
    namespace: overlap
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
