apiVersion: apps/v1
kind: Deployment
metadata:
  name: overlap-web
  namespace: overlap
  labels:
    app: overlap-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: overlap-web
  strategy:
    # Stateless — unlike the bot, a rolling update here doesn't cost a
    # Discord gateway reconnect.
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: overlap-web
    spec:
      imagePullSecrets:
        - name: overlap-premium-deploy-key
      containers:
        - name: overlap-web
          # See deployment-bot.yaml's note — same image, same version gate.
          image: ghcr.io/smithlabs-io/overlap-premium:sha-946ebb4
          imagePullPolicy: IfNotPresent
          command: [ "python", "-m", "overlap.web" ]
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: overlap-db-role
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: overlap-db-role
                  key: password
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@homelab-pg-rw.cnpg.svc.cluster.local:5432/overlap"
          envFrom:
            - secretRef:
                name: discord-token
            - configMapRef:
                name: overlap-config
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
