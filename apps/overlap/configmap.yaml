apiVersion: v1
kind: ConfigMap
metadata:
  name: overlap-config
  namespace: overlap
data:
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"
  MAX_ACTIVE_EVENTS: "10"
  # overlap-premium's own default — set explicitly here so it's visible in
  # git rather than an implicit fallback.
  BILLING_MODE: "votes"
  WEB_BASE_URL: "https://api.smithlabs.io"
