apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: overlap-web
  namespace: overlap
spec:
  # Public path: Cloudflare terminates TLS at the edge for the tunnel, so
  # Traefik sees plain HTTP here and needs no cert of its own.
  ingressClassName: traefik
  rules:
    - host: api.smithlabs.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: overlap-web
                port:
                  name: http
